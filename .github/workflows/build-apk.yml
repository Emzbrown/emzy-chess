name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.x requires JDK 17+.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # One APK per CPU architecture: modern phones are arm64-v8a only, so
      # they download just their slice instead of every engine binary.
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      # Separate artifacts so a phone only downloads its own architecture.
      - name: Report APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload arm64-v8a APK (most modern phones)
        uses: actions/upload-artifact@v4
        with:
          name: emzy-chess-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK (older 32-bit phones)
        uses: actions/upload-artifact@v4
        with:
          name: emzy-chess-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK (emulators)
        uses: actions/upload-artifact@v4
        with:
          name: emzy-chess-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
